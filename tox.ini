[tox]
envlist = csslint,eslint,py{311,312}-django{42,52},quality

[testenv]
passenv = QUALTRICS_TEST_PLATFORM_ROOT
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
deps = 
    django42: Django>=4.2,<4.3
    django52: Django==5.2.11
    -rrequirements/test.txt
commands = 
    coverage run manage.py test qualtricssurvey.tests
    coverage report
    coverage html

[testenv:clean]
commands = 
    coverage erase
deps = 
    -rrequirements/test.txt
skip_install = True

[testenv:csslint]
allowlist_externals =
    make
    {toxinidir}/node_modules/csslint/dist/cli.js
passenv =
    TRAVIS
    TRAVIS_JOB_ID
    TRAVIS_BRANCH
commands = 
    make requirements_js
    {toxinidir}/node_modules/csslint/dist/cli.js qualtricssurvey/static/css/
deps = 
skip_install = True

[testenv:eslint]
allowlist_externals =
    make
    {toxinidir}/node_modules/eslint/bin/eslint.js
passenv =
    TRAVIS
    TRAVIS_JOB_ID
    TRAVIS_BRANCH
commands = 
    make requirements_js
    {toxinidir}/node_modules/eslint/bin/eslint.js qualtricssurvey/static/js/
deps = 
skip_install = True

[testenv:quality]
setenv =
    DJANGO_SETTINGS_MODULE = test_utils.lint_settings
    PYTHONPATH = {toxinidir}
passenv =
    TRAVIS
    TRAVIS_JOB_ID
    TRAVIS_BRANCH
deps = 
    Django==5.2.11
    -rrequirements/quality.txt
commands = 
    pycodestyle qualtricssurvey/
    pylint qualtricssurvey/

[testenv:transifex]
deps = 
    transifex-client
commands = 
    tx push -s

