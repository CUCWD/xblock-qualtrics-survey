<div class="qualtricssurvey_block">
    <div class="qualtrics_message"> 
        <div class="grade">
          <span class="grade_points" style="display:none;">
            <span class="earned_score">{{earned_score}}</span>/<span class="possible_score">{{possible_score}}</span> points
          </span>
          <span class = "is_graded"></span><span class="status"></span>
        </div>
        <p>{{message}}</p>
    </div>
    <iframe class="qualtrics-survey-iframe" src="https://{{your_university}}.qualtrics.com/jfe/form/{{survey_id}}?{{lms_root_url}}&amp;{{block_location_id}}&amp;{{course_id_string}}&amp;{{course_name_string}}&amp;{{course_org_string}}&amp;{{course_number_string}}&amp;{{course_run_string}}&amp;{{course_term_string}}&amp;{{course_start_date_string}}&amp;{{course_end_date_string}}&amp;{{course_institution_string}}&amp;{{course_instructor_string}}&amp;{{course_module_name_string}}&amp;{{forward_platform_user_pii}}&amp;{{forward_platform_user_demographic_data}}&amp;{{forward_course_organization_data}}&amp;{{show_simulation_exists_string}}&amp;{{show_meta_information_string}}&amp;{{anon_user_id_string}}&amp;{{gradeable_subsection_string}}" style="height: 900px;"></iframe>
</div>
